<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动爱家 - 网页版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #05070C;
            --bg-card: #0F131C;
            --bg-hover: #161D2B;
            --accent: #38BDF8;
            --accent-dim: #1E3A52;
            --text-primary: #E8EDF3;
            --text-secondary: #8B9CAD;
            --success: #6EE7B7;
            --warning: #E9A568;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: clamp(1rem, 3vw, 2rem);
        }

        /* 头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(1rem, 2vw, 1.5rem) 0;
            border-bottom: 1px solid var(--bg-hover);
            margin-bottom: clamp(1.5rem, 4vw, 3rem);
        }

        .logo {
            font-size: clamp(1.25rem, 3vw, 1.75rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--accent);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-secondary);
            font-size: clamp(0.875rem, 2vw, 1rem);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 设备列表 */
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: clamp(1rem, 2vw, 1.5rem);
        }

        .device-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .device-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(56, 189, 248, 0.15);
        }

        .device-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--bg-dark);
            position: relative;
            overflow: hidden;
        }

        .device-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .device-thumbnail::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 60%, var(--bg-card) 100%);
            z-index: 1;
        }

        .thumbnail-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .device-status {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 12px;
            background: rgba(5, 7, 12, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .device-status.online {
            color: var(--success);
        }

        .device-info {
            padding: clamp(0.875rem, 2vw, 1.25rem);
        }

        .device-name {
            font-size: clamp(1rem, 2.5vw, 1.125rem);
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        .device-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .device-meta span {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        /* 视频播放器 */
        .video-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 12, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            padding: clamp(1rem, 3vw, 2rem);
        }

        .video-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            width: 100%;
            max-width: 1000px;
            background: var(--bg-card);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
        }

        .video-header {
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--bg-hover);
        }

        .video-title {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--bg-hover);
            color: var(--text-primary);
            border-radius: 999px;
            cursor: pointer;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: var(--accent-dim);
        }

        .video-player {
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .video-info {
            padding: 1.25rem 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            font-size: 0.875rem;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* 加载动画 */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-hover);
            border-top-color: var(--accent);
            border-radius: 999px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .device-grid {
                grid-template-columns: 1fr;
            }
            
            .video-info {
                grid-template-columns: 1fr;
            }
        }

        /* 错误提示 */
        .error-banner {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-hover));
            border-left: 4px solid var(--warning);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 2rem;
            font-size: 0.9375rem;
            line-height: 1.6;
        }

        .error-banner strong {
            color: var(--warning);
            display: block;
            margin-bottom: 0.5rem;
        }

        .error-banner a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .error-banner a:hover {
            border-bottom-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">🏠 移动爱家</div>
            <div class="user-info">
                <div class="status-dot"></div>
                <span>178****9340</span>
            </div>
        </header>

        <!-- 提示信息 -->
        <div class="error-banner">
            <strong>⚠️ 静态数据模式</strong>
            当前显示的是从抓包数据提取的真实设备信息。由于移动爱家API有加密保护，视频流暂时无法播放。
            如需完整功能，请参考 <a href="https://github.com/imthnio/mobile-home-web" target="_blank">GitHub仓库</a> 的说明文档。
        </div>

        <!-- 设备列表 -->
        <div class="device-grid" id="deviceGrid">
            <!-- 动态生成 -->
        </div>
    </div>

    <!-- 视频播放弹窗 -->
    <div class="video-modal" id="videoModal">
        <div class="video-container">
            <div class="video-header">
                <div class="video-title" id="videoTitle">加载中...</div>
                <button class="close-btn" onclick="closeVideo()">×</button>
            </div>
            <div class="video-player">
                <div class="spinner"></div>
            </div>
            <div class="video-info" id="videoInfo">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 真实设备数据（从Charles抓包提取）
        const realDevice = {
            deviceid: "xxxxS_607ea47ea0d3",
            devicename: "智能摄像头-1",
            serialNumber: "2184170000306773",
            cameraModel: "IPC_CM_JZ_CMSXJ26B",
            onlineStatus: "available",
            region: "gy-ecloud",
            thumbnail: "https://file-gy-node-media.camera.komect.com:50443/lookup/thumbnail/xxxxS_607ea47ea0d3/current?token=U%24T%40L%26A0Vy%2FAF3DcMS%2BQyFv60N0RFWcpGBmKxM5jUn4IcFS7wAK%2BeY2UnhC5eZzIfQ0f6hC&width=320&region=gy-ecloud&expire=U%24T%40L%26AuVws37QkxKrk7WGfXyb62g%3D%3D",
            resolution: "2304x1296",
            videoQuality: "high",
            relayServer: {
                host: "36.134.224.31",
                port: "50921"
            },
            features: {
                HDVideo: "开启",
                motionDetection: "开启",
                peopleDetection: "开启",
                nightVision: "自动",
                soundDetection: "关闭",
                motionTrack: "开启"
            }
        };

        // 渲染设备卡片
        function renderDevices() {
            const grid = document.getElementById('deviceGrid');
            const card = createDeviceCard(realDevice);
            grid.innerHTML = card;
        }

        // 创建设备卡片
        function createDeviceCard(device) {
            const isOnline = device.onlineStatus === 'available';
            
            return `
                <div class="device-card" onclick="openVideo('${device.deviceid}')">
                    <div class="device-thumbnail">
                        <img src="${device.thumbnail}" 
                             alt="${device.devicename}"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                        <div class="thumbnail-loading" style="display: none;">
                            <div class="spinner"></div>
                        </div>
                        <div class="device-status ${isOnline ? 'online' : ''}">
                            <div class="status-dot"></div>
                            ${isOnline ? '在线' : '离线'}
                        </div>
                    </div>
                    <div class="device-info">
                        <div class="device-name">${device.devicename}</div>
                        <div class="device-meta">
                            <span>📹 ${device.resolution}</span>
                            <span>🌐 ${device.region}</span>
                            <span>🎯 ${device.videoQuality === 'high' ? '高清' : '标清'}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 打开视频播放
        function openVideo(deviceId) {
            const device = realDevice;
            const modal = document.getElementById('videoModal');
            const title = document.getElementById('videoTitle');
            const info = document.getElementById('videoInfo');

            title.textContent = device.devicename;
            
            info.innerHTML = `
                <div class="info-item">
                    <div class="info-label">设备型号</div>
                    <div class="info-value">${device.cameraModel}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">序列号</div>
                    <div class="info-value">${device.serialNumber}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">分辨率</div>
                    <div class="info-value">${device.resolution}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">中继服务器</div>
                    <div class="info-value">${device.relayServer.host}:${device.relayServer.port}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">高清视频</div>
                    <div class="info-value">${device.features.HDVideo}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">移动侦测</div>
                    <div class="info-value">${device.features.motionDetection}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">人形检测</div>
                    <div class="info-value">${device.features.peopleDetection}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">夜视模式</div>
                    <div class="info-value">${device.features.nightVision}</div>
                </div>
            `;

            modal.classList.add('active');
        }

        // 关闭视频播放
        function closeVideo() {
            document.getElementById('videoModal').classList.remove('active');
        }

        // 键盘ESC关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeVideo();
        });

        // 点击背景关闭
        document.getElementById('videoModal').addEventListener('click', (e) => {
            if (e.target.id === 'videoModal') closeVideo();
        });

        // 初始化
        renderDevices();
    </script>
</body>
</html>
